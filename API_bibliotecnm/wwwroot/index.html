<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de administración de Bibliotecnm">
  <title>Bibliotecnm · Administración</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div class="brand-text">
          <strong>Bibliotecnm</strong>
          <span>Panel de administración</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="resumen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Resumen</span>
        </button>
        <button class="nav-item" data-view="libros">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>Libros</span>
        </button>
        <button class="nav-item" data-view="autores">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Autores</span>
        </button>
        <button class="nav-item" data-view="generos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.6 13.4 12 22l-9-9V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span>Géneros</span>
        </button>
        <button class="nav-item" data-view="ejemplares">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
          <span>Ejemplares</span>
        </button>
        <button class="nav-item" data-view="prestamos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 2 21 6l-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span>Préstamos</span>
        </button>
        <button class="nav-item" data-view="usuarios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>
          <span>Usuarios</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Verificando conexión…</span>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button class="icon-button menu-button" id="menuButton" aria-label="Abrir menú">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="page-head">
          <h1 id="pageTitle">Resumen</h1>
          <p id="pageSubtitle">Estado general de la biblioteca</p>
        </div>
        <div class="topbar-right">
          <span class="date-pill" id="datePill"></span>
          <a class="btn btn-ghost" href="/swagger" target="_blank" rel="noopener">Documentación API</a>
        </div>
      </header>

      <main class="content">
        <section class="view active" id="view-resumen" data-title="Resumen" data-subtitle="Estado general de la biblioteca"></section>
        <section class="view" id="view-libros" data-title="Libros" data-subtitle="Catálogo, autores y disponibilidad"></section>
        <section class="view" id="view-autores" data-title="Autores" data-subtitle="Autores registrados en el catálogo"></section>
        <section class="view" id="view-generos" data-title="Géneros" data-subtitle="Clasificación temática del catálogo"></section>
        <section class="view" id="view-ejemplares" data-title="Ejemplares" data-subtitle="Copias físicas y su estado"></section>
        <section class="view" id="view-prestamos" data-title="Préstamos" data-subtitle="Circulación y devoluciones"></section>
        <section class="view" id="view-usuarios" data-title="Usuarios" data-subtitle="Lectores y personal de la biblioteca"></section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Título</h2>
        <button class="icon-button" id="modalClose" type="button" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="modalForm">
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="modalCancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="modalSubmit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
